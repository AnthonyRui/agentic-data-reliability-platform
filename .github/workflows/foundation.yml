name: Foundation checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Generate synthetic baseline
        run: python -m data.generator.generate
      - name: Set ephemeral database password
        shell: bash
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose up -d --wait --wait-timeout 150
      - run: python scripts/verify_database.py
      - name: Startup diagnostics
        if: failure()
        run: docker compose logs --no-color postgres
      - name: Stop temporary CI database
        if: always()
        run: docker compose down --volumes
