name: Foundation checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -r requirements-pipeline.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v
      - name: Validate Dagster definitions without a database
        env:
          DBT_ENV_SECRET_POSTGRES_PASSWORD: parse-only-not-a-real-credential
        run: python -m scripts.run_pipeline --check

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Set ephemeral database password
        shell: bash
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Install pinned data pipeline
        run: python -m pip install -r requirements-pipeline.txt
      - run: docker compose config --quiet
      - name: Fresh full Dagster pipeline
        run: python -m scripts.run_pipeline
      - name: Reuse dataset and database on second run
        run: python -m scripts.run_pipeline
      - name: Verify persisted Dagster run history
        run: python -m scripts.verify_pipeline_runs
      - name: Startup diagnostics
        if: failure()
        run: docker compose logs --no-color postgres
      - name: Stop temporary CI database
        if: always()
        run: docker compose down --volumes
